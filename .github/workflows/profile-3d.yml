name: 3D contribution graph

on:
  schedule:
    # Daily at 03:17 Asia/Baku (23:17 UTC).
    - cron: '17 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-3d.yml'
      - '.github/profile-3d-settings.json'

permissions:
  contents: write

concurrency:
  group: profile-3d-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Generate animated 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit updated graph
        run: |
          test -s profile-3d-contrib/profile-zeitgeist.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-3d-contrib/profile-zeitgeist.svg
          if git diff --cached --quiet; then
            echo "Contribution graph is already current."
            exit 0
          fi
          git commit -m "chore: update 3D contribution graph"
          git pull --rebase origin main
          git push origin HEAD:main
